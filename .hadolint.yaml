# hadolint config for the Custos ROS2 base image.
#
# DL3008 (pin apt package versions): impractical on a rolling ROS2 apt repo —
#   ros-<distro>-* and their transitive deps are not individually versioned by
#   us, and pinning would break on every upstream point release.
# DL3002 (last USER must not be root): intentional. This is a base dev image;
#   the devcontainer and downstream images add the unprivileged user.
ignored:
  - DL3008
  - DL3002
